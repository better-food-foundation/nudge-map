name: Tests
on: [pull_request, workflow_dispatch]
jobs:
  test:
    if: github.repository_owner == 'better-food-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          npx playwright install --with-deps
      - name: Generate downloadable data archive
        run: npm run gen-data-set
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
